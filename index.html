<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>가족 갈등 해결 실시간 역할극</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
:root{
  --bg:#F5F5F7; --surface:#FFFFFF; --surface-2:#FBFBFD;
  --ink:#1D1D1F; --ink-2:#6E6E73; --ink-3:#A1A1A6;
  --hairline:rgba(0,0,0,.09);
  --blue:#0071E3; --blue-press:#0060BF;
  --child:#243B53; --child-soft:#EDF2F7; --child-ink:#243B53;
  --parent:#243B53; --parent-soft:#EDF2F7; --parent-ink:#243B53;
  --ai-bubble:#E9E9EB; --me-bubble:#0071E3;
  --r-card:20px; --r-btn:14px; --r-modal:22px; --r-pill:980px;
  --sh-card:0 1px 3px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
  --sh-pop:0 24px 70px rgba(0,0,0,.28);
  --ease:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box} html,body{margin:0}
body{ font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif; background:var(--bg); color:var(--ink); font-size:17px; line-height:1.47; letter-spacing:-.01em; display:grid; place-items:center; min-height:100dvh; padding:20px; }
h1,h2,h3,p{margin:0} button{font:inherit} :focus-visible{outline:2px solid var(--blue); outline-offset:2px; border-radius:6px}

.app-shell{ width:100%; max-width:460px; height:min(760px, calc(100dvh - 40px)); background:var(--surface); border-radius:34px; border:1px solid var(--hairline); box-shadow:var(--sh-card); overflow:hidden; display:flex; flex-direction:column; position:relative; }
.screen{display:none; flex-direction:column; height:100%}
.app-shell[data-state="home"] .screen--home, .app-shell[data-state="live"] .screen--live{display:flex; animation:screenIn .45s var(--ease)}
@keyframes screenIn{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}

.bar{height:56px; flex-shrink:0; display:flex; align-items:center; gap:12px; padding:0 16px; border-bottom:1px solid var(--hairline)}
.bar__title{font-size:16px; font-weight:700; letter-spacing:-.01em; overflow:hidden}
.bar__title span{display:block; white-space:nowrap; text-overflow:ellipsis; overflow:hidden; max-width:210px}
.bar__title small{display:block; font-size:11px; font-weight:600; color:var(--ink-3)}
.bar__spacer{flex:1}
.icon-btn{width:34px; height:34px; border:0; background:#F0F0F2; border-radius:50%; display:grid; place-items:center; cursor:pointer; color:var(--ink-2); font-size:15px; transition:.2s}
.icon-btn:active{transform:scale(.92)}
.role-chip{font-size:12px; font-weight:700; padding:5px 10px; border-radius:var(--r-pill); white-space:nowrap}
.role-chip--child{background:var(--child-soft); color:var(--child-ink)} .role-chip--parent{background:var(--parent-soft); color:var(--parent-ink)}

.screen--home .body{flex:1; overflow:auto; padding:22px 20px 16px}
.home-hero h2{font-size:25px; font-weight:800; letter-spacing:-.02em; line-height:1.3}
.home-hero p{font-size:14.5px; color:var(--ink-2); margin-top:6px}
.cat-label{font-size:12px; font-weight:700; color:var(--ink-3); margin:20px 4px 10px; letter-spacing:.02em} .cat-label:first-of-type{margin-top:16px}
.scenario-card{width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--hairline); border-radius:var(--r-card); padding:15px 16px; margin-bottom:10px; cursor:pointer; display:flex; align-items:center; gap:12px; transition:.2s var(--ease)}
.scenario-card:hover{transform:translateY(-1px); box-shadow:var(--sh-card); border-color:rgba(0,0,0,.14)}
.scenario-card[aria-selected="true"]{border-color:var(--blue); box-shadow:0 0 0 3px rgba(0,113,227,.14)}
.scenario-card__emoji{font-size:20px; width:40px; height:40px; flex-shrink:0; border-radius:12px; background:var(--surface); display:grid; place-items:center; border:1px solid var(--hairline)}
.scenario-card__txt{font-size:15px; font-weight:600; letter-spacing:-.01em; line-height:1.35}
.scenario-card__chev{margin-left:auto; color:var(--ink-3); flex-shrink:0}
.home-empty{color:var(--ink-3); font-size:14px; text-align:center; padding:40px 10px}

.split-dock{flex-shrink:0; padding:14px 20px calc(18px + env(safe-area-inset-bottom)); border-top:1px solid var(--hairline); background:rgba(255,255,255,.9); backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px)}
.split-dock[hidden]{display:none}
.split-dock__desc{font-size:12.5px; color:var(--ink-2); line-height:1.4; margin-bottom:10px; background:#F2F2F7; padding:8px 12px; border-radius:10px}
.split-dock__q{font-size:13px; color:var(--ink-2); text-align:center; margin-bottom:11px} .split-dock__q b{color:var(--ink); font-weight:700}
.split{display:grid; grid-template-columns:1fr 1fr; gap:11px}
.split button{border:1px solid #CAD3DD; cursor:pointer; padding:14px 0; border-radius:var(--r-btn); font-size:16px; font-weight:700; letter-spacing:-.01em; transition:.18s var(--ease); color:#fff}
.split button:active{transform:scale(.97)}
.split button:disabled{opacity:.5; cursor:not-allowed}
.split-dock__desc{white-space:pre-wrap}
.screen--live .bar{flex-wrap:wrap; height:auto; min-height:56px; padding-top:8px; padding-bottom:8px}
.screen--live .bar__title{flex:1; min-width:0}
.screen--live .role-chip{max-width:100%; white-space:normal; overflow-wrap:anywhere}
.split .btn-child, .split .btn-parent{background:#F4F7FA; color:#243B53}
.split button:hover:not(:disabled){background:#E5EDF5; border-color:#688099}
.split button:focus-visible{outline:3px solid #365E85; outline-offset:3px}
.split button small{display:block; font-size:11px; font-weight:500; opacity:.92; margin-top:2px}

.live-status{flex-shrink:0; display:flex; align-items:center; justify-content:center; gap:10px; padding:12px 0 6px}
.pill{display:inline-flex; align-items:center; gap:8px; background:#F0F0F2; color:var(--ink-2); font-size:13px; font-weight:600; padding:7px 14px; border-radius:var(--r-pill)}
.dot{width:8px; height:8px; border-radius:50%; background:var(--ink-3)}
.pill[data-mode="listen"] .dot{background:#34C759; animation:pulse 1.4s infinite}
.pill[data-mode="speak"] .dot{background:var(--blue); animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1; transform:scale(1)} 50%{opacity:.35; transform:scale(.7)}}
.time-chip{font-size:12px; font-weight:600; color:var(--ink-3); font-variant-numeric:tabular-nums}

.transcript{flex:1; overflow:auto; padding:6px 16px 12px; display:flex; flex-direction:column; gap:2px}
.turn{display:flex; flex-direction:column; margin-top:12px}
.turn--me{align-items:flex-end} .turn--ai{align-items:flex-start}
.turn__who{font-size:11px; font-weight:700; color:var(--ink-3); margin:0 6px 5px}
.bubble{max-width:82%; padding:10px 14px; font-size:15px; line-height:1.42; letter-spacing:-.01em; border-radius:20px; word-break:break-word; white-space:pre-wrap; animation:bubbleIn .3s var(--ease)}
.turn--ai .bubble{background:var(--ai-bubble); color:var(--ink); border-bottom-left-radius:7px}
.turn--me .bubble{background:var(--me-bubble); color:#fff; border-bottom-right-radius:7px}
@keyframes bubbleIn{from{opacity:0; transform:translateY(6px) scale(.98)} to{opacity:1; transform:none}}
.hint{color:var(--ink-3); font-size:13px; text-align:center; margin:22px auto; max-width:28ch; line-height:1.5}

.dock{flex-shrink:0; display:flex; align-items:center; justify-content:center; gap:20px; padding:14px 20px calc(18px + env(safe-area-inset-bottom)); border-top:1px solid var(--hairline)}
.dock__side{width:48px; height:48px; border-radius:50%; border:1px solid var(--hairline); background:var(--surface-2); color:var(--ink-2); cursor:pointer; display:grid; place-items:center; font-size:19px; transition:.2s}
.dock__side:active{transform:scale(.92)} .dock__side:disabled{opacity:.4; cursor:default}
.mic{width:72px; height:72px; border-radius:50%; border:0; background:var(--blue); color:#fff; cursor:pointer; display:grid; place-items:center; font-size:26px; position:relative; transition:.2s var(--ease)}
.mic:active{transform:scale(.94)} .mic:disabled{background:#C7C7CC; cursor:default}
.mic[data-on="true"]{background:#FF3B30}
.mic[data-on="true"]::before{content:""; position:absolute; inset:-6px; border-radius:50%; border:2px solid #FF3B30; opacity:.5; animation:ring 1.6s var(--ease) infinite}
@keyframes ring{0%{transform:scale(.9); opacity:.6} 100%{transform:scale(1.35); opacity:0}}

.btn{font-size:16px; font-weight:600; letter-spacing:-.01em; border-radius:var(--r-btn); padding:12px 22px; cursor:pointer; border:1px solid transparent; transition:.18s var(--ease)}
.btn:active{transform:scale(.97)} .btn--primary{background:var(--blue); color:#fff} .btn--ghost{background:transparent; color:var(--blue); border-color:var(--hairline)}
.scrim{position:fixed; inset:0; background:rgba(0,0,0,.32); backdrop-filter:saturate(180%) blur(16px); -webkit-backdrop-filter:saturate(180%) blur(16px); display:grid; place-items:center; padding:24px; opacity:0; pointer-events:none; transition:opacity .28s var(--ease); z-index:50}
.scrim[data-open="true"]{opacity:1; pointer-events:auto}
.modal{width:100%; max-width:320px; background:var(--surface); border-radius:var(--r-modal); box-shadow:var(--sh-pop); padding:24px 22px 18px; text-align:center; transform:scale(.86); opacity:0; transition:transform .34s var(--ease), opacity .28s ease}
.scrim[data-open="true"] .modal{transform:scale(1); opacity:1}
.modal__icon{width:52px; height:52px; margin:0 auto 14px; border-radius:50%; display:grid; place-items:center; font-size:22px; background:var(--child-soft); color:var(--child-ink)}
.modal__icon--warn{background:#FDEDE9; color:#C64A34}
.modal__title{font-size:18px; font-weight:700; letter-spacing:-.01em} .modal__msg{font-size:13.5px; color:var(--ink-2); margin-top:7px; line-height:1.5}
.modal__actions{display:flex; flex-direction:column; gap:9px; margin-top:20px} .modal__actions .btn{width:100%; text-align:center}
@media (max-width:520px){ body{padding:0} .app-shell{max-width:none; height:100dvh; border-radius:0; border:0; box-shadow:none} .bar__title span{max-width:190px} }

/* Desktop layout. Smaller screens keep the original mobile styles above. */
@media (min-width:960px){
  body{padding:28px}
  .app-shell{max-width:1760px; height:calc(100dvh - 56px); border-radius:28px}
  .screen{min-height:0}
  .bar{height:72px; padding:0 28px}
  .bar__title{min-width:0; font-size:18px}
  .bar__title span{max-width:none}
  .bar__title small{font-size:12px; margin-top:3px}
  .icon-btn{width:38px; height:38px; flex-shrink:0}
  .app-shell[data-state="home"] .screen--home{
    display:grid; grid-template-columns:minmax(0,1.35fr) minmax(360px,1fr);
    grid-template-rows:72px minmax(0,1fr);
  }
  .screen--home>.bar{grid-column:1 / -1}
  .screen--home .body{grid-column:1 / -1; min-height:0; padding:32px}
  .screen--home:has(.split-dock:not([hidden])) .body{grid-column:1}
  .home-hero h2{font-size:clamp(30px,2.5vw,44px)}
  .home-hero h2 br{display:none}
  .home-hero p{font-size:clamp(18px,1.4vw,24px); margin-top:10px}
  #scenarioList{display:grid; grid-template-columns:minmax(0,1fr); gap:12px; align-content:start; margin-top:24px}
  #scenarioList .cat-label{grid-column:1 / -1; margin:12px 4px 0; font-size:clamp(16px,1.1vw,20px); color:#515158}
  #scenarioList .home-empty{grid-column:1 / -1}
  .scenario-card{min-width:0; min-height:112px; margin:0; padding:22px 24px; gap:18px}
  .scenario-card[aria-selected="true"]{background:#EDF3F9; border-color:#365E85; box-shadow:inset 5px 0 #365E85}
  .scenario-card__emoji{width:48px; height:48px; font-size:26px}
  .scenario-card__chev{font-size:28px}
  .scenario-card__txt{font-size:clamp(24px,1.7vw,32px); line-height:1.45; word-break:keep-all; overflow-wrap:anywhere}
  .split-dock{grid-column:2; grid-row:2; min-height:0; overflow:auto; border-top:0; border-left:1px solid var(--hairline); padding:32px 24px; background:var(--surface-2)}
  .split-dock__desc{font-size:clamp(22px,1.5vw,28px); color:#343A40; line-height:1.65; padding:18px; margin-bottom:24px; overflow-wrap:anywhere}
  .split-dock__q{font-size:clamp(22px,1.5vw,28px); text-align:left; line-height:1.6; margin-bottom:20px; overflow-wrap:anywhere}
  .split{grid-template-columns:1fr; gap:12px}
  .split button{padding:22px 20px; font-size:clamp(22px,1.5vw,28px); text-align:left; border-radius:14px; line-height:1.4; word-break:keep-all; overflow-wrap:anywhere}
  .split button small{font-size:clamp(16px,1.1vw,20px); color:#526477; margin-top:4px}
  /* Prioritize projected conversation text over surrounding controls. */
  .app-shell[data-state="live"]{max-width:1760px; height:calc(100dvh - 56px)}
  .screen--live .bar{height:auto; min-height:64px}
  .screen--live .bar__title{font-size:22px}
  .screen--live .bar__title small{font-size:14px; color:var(--ink-2)}
  .screen--live .role-chip{font-size:16px}
  .live-status{padding:10px 0}
  .live-status .pill{font-size:16px; color:#424247}
  .time-chip{font-size:16px; color:#515158}
  .transcript{min-height:0; padding:8px clamp(24px,3vw,56px) 28px; scrollbar-gutter:stable}
  .bubble{max-width:min(88%,46ch); font-size:clamp(28px,2.1vw,40px); font-weight:500; line-height:1.6; padding:18px 24px; word-break:keep-all; overflow-wrap:anywhere}
  .turn--ai .bubble{background:#E9E9EB; color:#171719}
  .turn--me .bubble{background:#005BBB; color:#fff}
  .turn{margin-top:24px}
  .turn__who{font-size:20px; color:#515158; margin-bottom:8px}
  .hint{font-size:24px; color:#515158; max-width:48ch}
  .dock{gap:32px; padding:10px 28px}
  .screen--live .mic{width:60px; height:60px}
  .modal{max-width:400px; padding:32px}
}
</style>
</head>
<body>

<div class="app-shell" id="shell" data-state="home">
  <!-- ══ HOME ══ -->
  <section class="screen screen--home">
    <div class="bar">
      <div class="bar__title"><span>가족 갈등 해결 역할극</span><small>도덕 · 역지사지 & 나-전달법</small></div>
      <div class="bar__spacer"></div>
      <button class="icon-btn" id="reloadBtn" title="새로고침" aria-label="새로고침">⟳</button>
    </div>
    <div class="body">
      <div class="home-hero">
        <h2>어떤 상황을 <br/>해결해 볼까요?</h2>
        <p>상황을 선택하고 내가 맡을 역할을 정해보세요.</p>
      </div>
      <div id="scenarioList"><div class="home-empty">시나리오를 불러오는 중…</div></div>
    </div>
    <div class="split-dock" id="splitDock" hidden>
      <div class="split-dock__desc" id="pickedDesc"></div>
      <p class="split-dock__q">「<b id="pickedTitle"></b>」<br/>내가 맡을 역할은?</p>
      <div class="split">
        <button class="btn-child" id="pickChild" disabled>역할 선택</button>
        <button class="btn-parent" id="pickParent" disabled>역할 선택</button>
      </div>
    </div>
  </section>

  <!-- ══ LIVE ══ -->
  <section class="screen screen--live">
    <div class="bar">
      <button class="icon-btn" id="endBtn" title="종료" aria-label="역할극 종료">✕</button>
      <div class="bar__title"><span id="liveTitle">시나리오</span><small>실시간 음성 대화</small></div>
      <div class="bar__spacer"></div>
      <span class="role-chip role-chip--child" id="liveRoleChip">내 역할</span>
    </div>
    <div class="live-status">
      <span class="pill" id="statusPill" data-mode="connect"><span class="dot" id="statusDot"></span><span id="statusTxt">연결 중…</span></span>
      <span class="time-chip" id="timeChip" hidden>00:00</span>
    </div>
    <div class="transcript" id="transcript" aria-live="polite"></div>
    <div class="dock">
      <button class="dock__side" id="saveBtn" title="대화 저장" aria-label="대화 저장" disabled>⤓</button>
      <button class="mic" id="micBtn" data-on="false" title="마이크" aria-label="마이크 켜기/끄기" disabled>🎙️</button>
      <button class="dock__side" id="endBtn2" title="종료" aria-label="역할극 종료">✕</button>
    </div>
  </section>
</div>

<!-- Modal -->
<div class="scrim" id="scrim" data-open="false">
  <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="mTitle" aria-describedby="mMsg">
    <div class="modal__icon" id="mIcon">✕</div>
    <h3 class="modal__title" id="mTitle"></h3><p class="modal__msg" id="mMsg"></p><div class="modal__actions" id="mActions"></div>
  </div>
</div>

<script>
/*═══════════════════════════════════════════════════════════════════
 * 배포된 GAS 웹앱 실행 URL (새 배포 ID 적용 완료)
 *═══════════════════════════════════════════════════════════════════*/
const GAS_URL = "https://script.google.com/macros/s/AKfycbzNI2h9zczInUxZnGSmG-1fcashzfmxqQ_X1T8mWw_1Vu6uTZ2eHKdjEHJL7dEL1XY/exec";

// Keep legacy API keys while displaying scenario-specific roles.
// The parent key corresponds to sheet column D; child corresponds to column E.
const SCENARIO_ROLES = {
  S01:{parent:'아빠', child:'딸'},
  S02:{parent:'개인 작업 중인 배우자', child:'가사·돌봄 중인 배우자'},
  S03:{parent:'물건을 정리한 가족', child:'물건의 주인'},
  S04:{parent:'사업을 조언하는 가족', child:'사업을 운영하는 가족'},
};
function scenarioRoles(item){
  const parent=typeof item.roleParent==='string' ? item.roleParent.trim() : '';
  const child=typeof item.roleChild==='string' ? item.roleChild.trim() : '';
  if(parent && child && parent!==child) return {parent,child};
  return SCENARIO_ROLES[item.id] || null;
}
const SESSION_MINUTES = 10;
const INPUT_RATE = 16000, OUTPUT_RATE = 24000;
const CAT_EMOJI = { '영화': '🎬', '일상': '🏠', '학교': '🏫', '친구': '👥', '살림남': '📺' };

const $ = s => document.querySelector(s);
const shell=$('#shell'), scrim=$('#scrim');

const S = {
  scenarioId:'', title:'', description:'', roles:null, userRole:'child', session:null,
  ws:null, inCtx:null, outCtx:null, stream:null, proc:null, micOn:false,
  playHead:0, sources:[], aiSpeaking:false, connected:false,
  transcript:[], aiBubble:null, meBubble:null, timer:null, remain:SESSION_MINUTES*60,
};

const myRoleName = () => S.roles[S.userRole];
const aiRoleName = () => S.roles[S.userRole==='child'?'parent':'child'];
const startMessage = () => aiRoleName()+' 역할로 상황을 시작해. 상대는 '+myRoleName()+'이야. 상황에 맞는 첫 마디를 짧게 건네줘.';
const setScreen = s => shell.dataset.state = s;
function showModal({icon='✕', warn=false, title, msg='', actions=[]}){
  $('#mIcon').textContent=icon; $('#mIcon').className='modal__icon'+(warn?' modal__icon--warn':'');
  $('#mTitle').textContent=title; $('#mMsg').textContent=msg;
  const wrap=$('#mActions'); wrap.innerHTML='';
  actions.forEach(a=>{
    const b=document.createElement('button');
    b.className='btn '+(a.style||'btn--ghost'); b.textContent=a.label;
    b.onclick=()=>{ if(!a.keepOpen) closeModal(); a.onClick&&a.onClick(); };
    wrap.appendChild(b);
  }); scrim.dataset.open='true';
}
const closeModal=()=>scrim.dataset.open='false'; scrim.onclick=e=>{ if(e.target===scrim) closeModal(); };

async function loadScenarios(){
  $('#splitDock').hidden=true; S.roles=null;
  const list=$('#scenarioList'); list.innerHTML='<div class="home-empty">시나리오를 불러오는 중…</div>';
  try{
    const res=await fetch(GAS_URL+'?action=scenarios'); const data=await res.json();
    if(!data.ok) throw new Error(data.error||'시나리오 로드 실패');
    renderScenarios(data.scenarios||[]);
  }catch(err){
    list.innerHTML='<div class="home-empty">시나리오를 불러오지 못했습니다.</div>';
    showModal({icon:'!', warn:true, title:'연결 실패', msg:String(err.message||err), actions:[{label:'다시 시도', style:'btn--primary', onClick:loadScenarios}]});
  }
}

function renderScenarios(scenarios){
  const list=$('#scenarioList'); if(!scenarios.length){ list.innerHTML='<div class="home-empty">등록된 시나리오가 없습니다.</div>'; return; }
  const groups={}; scenarios.forEach(s=>{ const k=s.category||'기타'; (groups[k]=groups[k]||[]).push(s); });
  list.innerHTML='';
  Object.keys(groups).sort().forEach(cat=>{
    const label=document.createElement('div'); label.className='cat-label'; label.textContent=cat; list.appendChild(label);
    groups[cat].forEach(item=>{
      const emojiKey = Object.keys(CAT_EMOJI).find(k => cat.includes(k)) || '일상'; const emoji = CAT_EMOJI[emojiKey] || '💬';
      const card=document.createElement('button'); card.className='scenario-card'; card.setAttribute('aria-selected','false');
      card.innerHTML=`<span class="scenario-card__emoji">${emoji}</span><span class="scenario-card__txt"></span><span class="scenario-card__chev">›</span>`;
      card.querySelector('.scenario-card__txt').textContent=item.title; card.onclick=()=>selectScenario(card, item);
      list.appendChild(card);
    });
  });
}

function selectScenario(card, item){
  document.querySelectorAll('.scenario-card').forEach(c=>c.setAttribute('aria-selected','false')); card.setAttribute('aria-selected','true');
  S.scenarioId=item.id; S.title=item.title; S.description=item.description;
  $('#pickedTitle').textContent=item.title; $('#pickedDesc').textContent='상황: '+item.description;
  S.roles=scenarioRoles(item);
  ['child','parent'].forEach(role=>{
    const button=$(role==='child'?'#pickChild':'#pickParent');
    button.disabled=!S.roles;
    button.replaceChildren(document.createTextNode(S.roles ? S.roles[role]+' 역할' : '역할 정보 없음'));
    if(S.roles){
      const note=document.createElement('small');
      note.textContent='AI는 '+S.roles[role==='child'?'parent':'child']+' 역할';
      button.appendChild(note);
    }
  });
  if(!S.roles) $('#pickedDesc').textContent+='\n이 시나리오의 역할 정보가 등록되지 않았습니다.';
  $('#splitDock').hidden=false; card.scrollIntoView({block:'nearest', behavior:'smooth'});
}

$('#pickChild').onclick=()=>beginRoleplay('child'); $('#pickParent').onclick=()=>beginRoleplay('parent');
async function beginRoleplay(userRole){
  if(!S.roles || !['child','parent'].includes(userRole)) return;
  S.userRole=userRole; $('#liveTitle').textContent=S.title;
  const chip=$('#liveRoleChip'); chip.textContent = '나 · '+myRoleName()+' (AI: '+aiRoleName()+')';
  chip.className='role-chip '+(userRole==='child'?'role-chip--child':'role-chip--parent');
  $('#transcript').innerHTML='<div class="hint">연결 중입니다...</div>'; S.transcript=[]; S.aiBubble=null; S.meBubble=null;
  setStatus('connect','연결 중…'); setScreen('live');
  try{
    const res=await fetch(GAS_URL,{ method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({action:'session', scenarioId:S.scenarioId, userRole}) });
    const data=await res.json(); if(!data.ok) throw new Error(data.error||'세션 생성 실패');
    if(data.roleParent && data.roleChild){
      S.roles={parent:data.roleParent,child:data.roleChild};
      chip.textContent='나 · '+myRoleName()+' (AI: '+aiRoleName()+')';
    }
    S.session=data; await connectLive(data);
  }catch(err){
    setStatus('connect','연결 실패'); showModal({icon:'!', warn:true, title:'대화 시작 실패', msg:String(err.message||err), actions:[{label:'목록으로', style:'btn--primary', onClick:()=>endRoleplay()}]});
  }
}

function connectLive(session){
  return new Promise((resolve,reject)=>{
    let opened=false; const ws=new WebSocket(session.wsUrl); S.ws=ws;
    ws.onopen=()=>{ opened=true; ws.send(JSON.stringify({ setup:{ model:'models/'+session.model, systemInstruction:{ parts:[{ text:session.systemInstruction }] }, outputAudioTranscription:{}, inputAudioTranscription:{} }})); };
    ws.onmessage=async ev=>{ const text = ev.data instanceof Blob ? await ev.data.text() : ev.data; let msg; try{ msg=JSON.parse(text); }catch(e){ return; } handleServer(msg, resolve); };
    ws.onerror=()=>{ if(!opened) reject(new Error('서버 연결 실패')); };
    ws.onclose=ev=>{ if(!opened) reject(new Error('종료됨 ('+ev.code+')')); if(S.connected && shell.dataset.state==='live') setStatus('connect','종료됨'); };
  });
}

async function handleServer(msg, resolveConnect){
  if(msg.setupComplete){
    S.connected=true; await startMic(); S.aiSpeaking=true; setStatus('speak','말하는 중…');
    const startTrigger = startMessage();
    S.ws.send(JSON.stringify({ clientContent:{ turns:[{ role:'user', parts:[{ text:startTrigger }]}], turnComplete:true }}));
    $('#transcript').innerHTML=''; $('#micBtn').disabled=false; $('#micBtn').dataset.on='true'; S.micOn=true; $('#saveBtn').disabled=false; startTimer(); resolveConnect&&resolveConnect(); return;
  }
  const sc=msg.serverContent; if(!sc) return;
  const parts=sc.modelTurn&&sc.modelTurn.parts||[];
  for(const p of parts){ if(p.inlineData&&p.inlineData.data){ S.aiSpeaking=true; setStatus('speak','말하는 중…'); playChunk(p.inlineData.data); } }
  const outT = sc.outputTranscription || msg.outputTranscription; const inT = sc.inputTranscription || msg.inputTranscription;
  if(outT&&outT.text!=null){ closeMe(); appendAi(outT.text); }
  if(inT &&inT.text!=null){ closeAi(); appendMe(inT.text); }
  if(sc.interrupted){ stopOutput(); S.aiSpeaking=false; setStatus('listen','듣는 중…'); }
  if(sc.turnComplete){ finishAiTurn(); }
}
function finishAiTurn(){ closeAi(); const remain=Math.max(0,(S.playHead-(S.outCtx?S.outCtx.currentTime:0))); setTimeout(()=>{ if(shell.dataset.state!=='live')return; S.aiSpeaking=false; if(S.micOn) setStatus('listen','듣는 중…'); }, remain*1000+180); }

function appendAi(t){ const aiLabel = aiRoleName()+' (AI)'; if(!S.aiBubble){ S.aiBubble=makeTurn('ai', aiLabel); S.transcript.push({who:'ai', text:''}); } S.aiBubble.textContent+=t; S.transcript[S.transcript.length-1].text=S.aiBubble.textContent; scrollDown(); }
function appendMe(t){ const myLabel = '나 ('+myRoleName()+')'; if(!S.meBubble){ S.meBubble=makeTurn('me', myLabel); S.transcript.push({who:'me', text:''}); } S.meBubble.textContent+=t; S.transcript[S.transcript.length-1].text=S.meBubble.textContent; scrollDown(); }
const closeAi=()=>S.aiBubble=null; const closeMe=()=>S.meBubble=null;
function makeTurn(who,label){ const t=document.createElement('div'); t.className='turn turn--'+who; const w=document.createElement('span'); w.className='turn__who'; w.textContent=label; const b=document.createElement('div'); b.className='bubble'; t.appendChild(w); t.appendChild(b); $('#transcript').appendChild(t); scrollDown(); return b; }
function scrollDown(){ const el=$('#transcript'); el.scrollTop=el.scrollHeight; }

async function startMic(){
  S.stream=await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true, channelCount:1 }});
  S.inCtx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:INPUT_RATE}); if(S.inCtx.state==='suspended') await S.inCtx.resume();
  const src=S.inCtx.createMediaStreamSource(S.stream); const proc=S.inCtx.createScriptProcessor(4096,1,1); S.proc=proc;
  proc.onaudioprocess=e=>{
    if(!S.connected||!S.micOn||S.aiSpeaking) return; if(S.ws.readyState!==WebSocket.OPEN) return;
    const f32=e.inputBuffer.getChannelData(0); const pcm=floatTo16k(f32, S.inCtx.sampleRate);
    S.ws.send(JSON.stringify({ realtimeInput:{ audio:{ data:int16ToB64(pcm), mimeType:'audio/pcm;rate=16000' }}}));
  }; src.connect(proc); proc.connect(S.inCtx.destination);
}
function floatTo16k(f32, srcRate){ let data=f32; if(srcRate!==INPUT_RATE){ const ratio=srcRate/INPUT_RATE, len=Math.round(f32.length/ratio), out=new Float32Array(len); for(let i=0;i<len;i++){ const idx=i*ratio, i0=Math.floor(idx), i1=Math.min(i0+1,f32.length-1); out[i]=f32[i0]+(f32[i1]-f32[i0])*(idx-i0); } data=out; } const pcm=new Int16Array(data.length); for(let i=0;i<data.length;i++){ const s=Math.max(-1,Math.min(1,data[i])); pcm[i]=s<0?s*0x8000:s*0x7FFF; } return pcm; }
function int16ToB64(int16){ const bytes=new Uint8Array(int16.buffer); let bin=''; for(let i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000)); return btoa(bin); }

function playChunk(b64){
  if(!S.outCtx){ S.outCtx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:OUTPUT_RATE}); S.playHead=0; }
  const bin=atob(b64), len=bin.length, bytes=new Uint8Array(len); for(let i=0;i<len;i++) bytes[i]=bin.charCodeAt(i);
  const int16=new Int16Array(bytes.buffer), f32=new Float32Array(int16.length); for(let i=0;i<int16.length;i++) f32[i]=int16[i]/32768;
  const buf=S.outCtx.createBuffer(1,f32.length,OUTPUT_RATE); buf.getChannelData(0).set(f32);
  const node=S.outCtx.createBufferSource(); node.buffer=buf; node.connect(S.outCtx.destination);
  const now=S.outCtx.currentTime; const start=Math.max(now,S.playHead); node.start(start); S.playHead=start+buf.duration; S.sources.push(node); node.onended=()=>{ S.sources=S.sources.filter(n=>n!==node); };
}
function stopOutput(){ S.sources.forEach(n=>{try{n.stop()}catch(e){}}); S.sources=[]; if(S.outCtx) S.playHead=S.outCtx.currentTime; }

$('#micBtn').onclick=()=>{ S.micOn=!S.micOn; $('#micBtn').dataset.on=String(S.micOn); if(S.micOn && !S.aiSpeaking) setStatus('listen','듣는 중…'); else if(!S.micOn) setStatus('connect','마이크 꺼짐'); };
function setStatus(mode,txt){ const pill=$('#statusPill'); pill.dataset.mode=mode; $('#statusTxt').textContent=txt; }

function startTimer(){ S.remain=SESSION_MINUTES*60; $('#timeChip').hidden=false; tick(); S.timer=setInterval(tick,1000); }
function tick(){
  const m=String(Math.floor(S.remain/60)).padStart(2,'0'), s=String(S.remain%60).padStart(2,'0'); $('#timeChip').textContent=m+':'+s;
  if(S.remain<=0){ clearInterval(S.timer); cleanup(); showModal({icon:'⏱', title:'대화 종료', msg:'대화 시간이 끝났습니다.', actions:[{label:'종료', style:'btn--primary', onClick:endRoleplay}]}); } S.remain--;
}
function askEnd(){ showModal({icon:'✕', warn:true, title:'마칠까요?', msg:'대화를 종료하고 상황 목록으로 돌아갑니다.', actions:[{label:'종료', style:'btn--primary', onClick:endRoleplay}, {label:'계속하기'}]}); }
$('#endBtn').onclick=askEnd; $('#endBtn2').onclick=askEnd;
function endRoleplay(){ cleanup(); setScreen('home'); $('#splitDock').hidden=true; }
function cleanup(){
  S.connected=false; S.micOn=false; S.aiSpeaking=false; if(S.timer){ clearInterval(S.timer); S.timer=null; } stopOutput();
  try{ S.ws&&S.ws.close(); }catch(e){} S.ws=null; try{ S.proc&&(S.proc.onaudioprocess=null,S.proc.disconnect()); }catch(e){} try{ S.stream&&S.stream.getTracks().forEach(t=>t.stop()); }catch(e){} try{ S.inCtx&&S.inCtx.close(); }catch(e){} S.inCtx=null; try{ S.outCtx&&S.outCtx.close(); }catch(e){} S.outCtx=null;
  $('#micBtn').disabled=true; $('#micBtn').dataset.on='false'; $('#saveBtn').disabled=true; $('#timeChip').hidden=true;
}

$('#saveBtn').onclick=saveTranscript;
function saveTranscript(){
  if(!S.transcript.length){ showModal({icon:'ⓘ', title:'대화 없음', msg:'진행 후 저장하세요.', actions:[{label:'확인', style:'btn--primary'}]}); return; }
  const myRole = myRoleName(); const aiRole = aiRoleName();
  const lines = S.transcript.filter(x=>x.text.trim()).map(x=>{ const who = x.who==='me' ? `나(${myRole})` : `상대(${aiRole})`; return `[${who}] ${x.text.trim()}`; });
  const out = ['[ 갈등 해결 대화 기록 ]', '• 주제: ' + S.title, '• 역할: ' + myRole, '• 일시: ' + new Date().toLocaleString('ko-KR'), '─'.repeat(30), '', ...lines].join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([out],{type:'text/plain;charset=utf-8'})); a.download=`기록_${S.title.slice(0,10)}.txt`; a.click(); URL.revokeObjectURL(a.href);
}

$('#reloadBtn').onclick=loadScenarios; loadScenarios();
</script>
